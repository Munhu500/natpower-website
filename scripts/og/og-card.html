<!doctype html>
<!--
  Open Graph share card template (1200×630).
  Rendered to public/og/natpower-og.jpg. To regenerate, open this file in a
  browser at a 1200×630 viewport, screenshot it and save it as a JPG under 150KB.
  The logo is the approved artwork, used as-is.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0a2213;
        overflow: hidden;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 64px;
        height: 100%;
        padding: 0 88px;
        box-sizing: border-box;
      }
      .logo {
        width: 360px;
        height: 360px;
        flex: none;
        object-fit: contain;
      }
      .rule {
        width: 40px;
        height: 2px;
        background: #a8843a;
      }
      h1 {
        margin: 28px 0 0;
        font-family: 'Archivo', sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1.05;
        letter-spacing: 0.14em;
        color: #f7f4ec;
        white-space: nowrap;
      }
      p {
        margin: 22px 0 0;
        max-width: 520px;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 26px;
        line-height: 1.45;
        color: rgb(247 244 236 / 0.7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="../../src/assets/natpower-logo.png" alt="" />
      <div>
        <div class="rule"></div>
        <h1>NATPOWER GROUP</h1>
        <p>Industrial chemicals and mining supply across Southern Africa</p>
      </div>
    </div>
  </body>
</html>
